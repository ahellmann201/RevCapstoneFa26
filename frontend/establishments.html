<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revmetrix | Establishments</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/establishments.css">
</head>
<body>
    <navbar></navbar>
    <main class="establishments-page">
        <header class="establishments-heading">
            <div>
                <h1>Establishments</h1>
            </div>
            <button class="add-establishment" id="add-establishment" type="button"
                aria-label="Add establishment" aria-haspopup="dialog">+</button>
        </header>
        <p class="establishments-empty" id="establishments-empty">
            No establishments yet. Use the + button to add your first place to bowl.
        </p>
        <ul class="establishment-list" id="establishment-list" aria-label="Establishments"></ul>
        <p class="page-status" id="establishment-status" role="status"></p>
    </main>
    <dialog class="establishment-dialog" id="establishment-dialog"
        aria-labelledby="establishment-dialog-title">
        <form id="establishment-form">
            <header class="dialog-heading">
                <h2 id="establishment-dialog-title">Add Establishment</h2>
                <button class="close-dialog" id="close-establishment" type="button" aria-label="Close">&times;</button>
            </header>
            <div class="establishment-fields">
                <label class="establishment-field" for="establishment-name">Name (required)
                    <input id="establishment-name" name="name" type="text" maxlength="255" required autofocus>
                </label>
                <label class="establishment-field" for="establishment-nickname">Nickname
                    <input id="establishment-nickname" name="nickname" type="text" maxlength="100">
                </label>
                <label class="establishment-field" for="establishment-type">Type
                    <input id="establishment-type" name="type" type="text" maxlength="100" placeholder="e.g. Brunswick">
                </label>
                <label class="establishment-field" for="establishment-lanes"># of Lanes
                    <input id="establishment-lanes" name="lanes" type="number" min="1" max="2147483647" step="1" inputmode="numeric">
                </label>
                <label class="establishment-field" for="establishment-address">Address
                    <input id="establishment-address" name="address" type="text" maxlength="500" autocomplete="street-address">
                </label>
                <label class="establishment-field" for="establishment-phone">Phone Number
                    <input id="establishment-phone" name="phone" type="tel" maxlength="50" autocomplete="tel">
                </label>
            </div>
            <div class="establishment-options">
                <label><input name="homeHouse" type="checkbox"> Home House</label>
                <label><input name="enabled" type="checkbox" checked> Enabled</label>
            </div>
            <footer class="dialog-actions">
                <button class="cancel-establishment" id="cancel-establishment" type="button">Cancel</button>
                <button class="apply-establishment" id="apply-establishment" type="submit">Add</button>
            </footer>
        </form>
    </dialog>
    <script type="module" src="/js/establishments.js"></script>
</body>
</html>
