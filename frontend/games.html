<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="/icons/revmetrix_logo.png">
    <link rel="stylesheet" href="/css/games.css">
    <title>RevMetrix | Games</title>
</head>
<body>
    <navbar></navbar>
    <main class="games-page">
        <header class="games-heading">
            <div>
                <h1 data-i18n="Games">Games</h1>
                <p>Choose a saved game to view its scorecard or continue playing.</p>
            </div>
            <a class="start-game-link" href="/index.html?start_game=1" data-i18n="Start Game">Start Game</a>
        </header>
        <a id="resume-local-game" class="local-game-link" href="/game.html" hidden>Continue your current game on this device</a>
        <label class="session-filter-label" for="session-game-filter">Show games in the same session as</label>
        <select id="session-game-filter" aria-describedby="session-filter-help">
            <option value="">All games</option>
        </select>
        <p id="session-filter-help" class="session-filter-help">Choose a saved game to show every game from its session.</p>
        <label class="game-search-label" for="game-search">Find a game</label>
        <input type="search" id="game-search" placeholder="Search by game number, event, or date">
        <p id="games-status" role="status">Loading your games…</p>
        <ul id="games-list" class="games-list"></ul>
    </main>
    <dialog id="rename-game-dialog" class="rename-game-dialog" aria-labelledby="rename-game-title">
        <form id="rename-game-form">
            <h2 id="rename-game-title">Name your game</h2>
            <label for="game-nickname">Game nickname</label>
            <input id="game-nickname" name="nickname" maxlength="100" autocomplete="off" aria-describedby="game-nickname-help">
            <p id="game-nickname-help">Leave blank to use the game number.</p>
            <p id="rename-game-status" role="status"></p>
            <div class="rename-game-actions">
                <button type="button" id="cancel-rename-game">Cancel</button>
                <button type="submit" id="save-game-nickname">Save</button>
            </div>
        </form>
    </dialog>
    <script type="module" src="/js/games.js"></script>
</body>
</html>
