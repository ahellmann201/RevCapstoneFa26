<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Revmetrix | Events</title>
    <link rel="icon" type="image/svg+xml" href="/icons/revmetrix_logo.png">
    <link rel="stylesheet" href="/css/events.css">
</head>
<body>
    <navbar></navbar>
    <main class="establishments-page">
        <header class="establishments-heading">
            <h1 data-i18n="Events">Events</h1>
            <a class="event-archives-link" href="/eventArchives.html" aria-label="Event archives" title="Event archives">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path d="M4 8h16v12H4zM3 4h18v4H3zM9 12h6" />
                </svg>
            </a>
            <button class="add-establishment" id="add-event" type="button" aria-label="Add event" aria-haspopup="dialog">+</button>
        </header>
        <p class="establishments-empty" id="events-empty">No events yet. Use the + button to add your first event.</p>
        <ul class="establishment-list" id="event-list" aria-label="Events"></ul>
        <p class="page-status" id="event-status" role="status"></p>
    </main>
    <dialog class="establishment-dialog" id="event-dialog" aria-labelledby="event-dialog-title">
        <form id="event-form">
            <header class="dialog-heading">
                <h2 id="event-dialog-title" data-i18n="Add Event">Add Event</h2>
                <button class="close-dialog" id="close-event" type="button" aria-label="Close">&times;</button>
            </header>
            <div class="establishment-fields">
                <label class="establishment-field">Full Name (required)
                    <input name="event_name" type="text" maxlength="255" required autofocus>
                </label>
                <label class="establishment-field">Nickname
                    <input name="nickname" type="text" maxlength="100">
                </label>
                <label class="establishment-field">Type
                    <select name="event_type">
                        <option value="">Select type</option>
                        <option value="League" data-i18n="League">League</option><option value="Tournament" data-i18n="Tournament">Tournament</option><option value="Practice" data-i18n="Practice">Practice</option><option value="Other" data-i18n="Other">Other</option>
                    </select>
                </label>
                <label class="establishment-field">Location
                    <select name="location_id" id="event-location"><option value="" data-i18n="Select location">Select location</option></select>
                </label>
                <label class="establishment-field">Week Day
                    <select name="week_day">
                        <option value="" data-i18n="Select day">Select day</option>
                        <option value="Monday" data-i18n="Monday">Monday</option><option value="Tuesday" data-i18n="Tuesday">Tuesday</option><option value="Wednesday" data-i18n="Wednesday">Wednesday</option><option value="Thursday" data-i18n="Thursday">Thursday</option>
                        <option value="Friday" data-i18n="Friday">Friday</option><option value="Saturday" data-i18n="Saturday">Saturday</option><option value="Sunday" data-i18n="Sunday">Sunday</option>
                    </select>
                </label>
                <label class="establishment-field">Start Time
                    <input name="start_time" type="time">
                </label>
                <label class="establishment-field">Games Per Session
                    <span class="games-stepper">
                        <input name="games_per_session" id="event-games" type="number" min="1" max="2147483647" step="1" value="3" inputmode="numeric">
                        <button type="button" id="decrease-games" aria-label="Decrease games per session">-</button>
                        <button type="button" id="increase-games" aria-label="Increase games per session">+</button>
                    </span>
                </label>
            </div>
            <footer class="dialog-actions">
                <button class="cancel-establishment" id="cancel-event" type="button" data-i18n="Cancel">Cancel</button>
                <button class="apply-establishment" id="apply-event" type="submit" data-i18n="Add">Add</button>
            </footer>
            <button class="delete-record" id="disable-event" type="button" hidden data-i18n="Disable Event">Disable Event</button>
            <p class="page-status" id="event-form-status" role="status"></p>
        </form>
    </dialog>
    <dialog class="establishment-dialog disable-confirmation" id="disable-event-dialog"
        aria-labelledby="disable-event-title" aria-describedby="disable-event-description">
        <h2 id="disable-event-title">Disable event?</h2>
        <p id="disable-event-description"></p>
        <div class="dialog-actions">
            <button class="cancel-establishment" id="cancel-disable-event" type="button" autofocus data-i18n="Cancel">Cancel</button>
            <button class="apply-establishment" id="confirm-disable-event" type="button" data-i18n="Disable Event">Disable Event</button>
        </div>
        <p class="page-status" id="disable-event-status" role="status"></p>
    </dialog>
    <script type="module" src="/js/events.js"></script>
</body>
</html>
