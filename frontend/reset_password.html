<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>RevMetrix | Password recovery</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="icon" type="image/svg+xml" href="/icons/revmetrix_logo.png" />
</head>
<body>
    <main style="max-width: 32rem; margin: 2rem auto; padding: 1rem; display: grid; gap: 1rem">
        <h1>Password recovery</h1>
        <form id="request-reset" method="post" style="display: grid; gap: .75rem">
            <label for="recovery-email">Account email</label>
            <input id="recovery-email" type="email" autocomplete="email" maxlength="255" required>
            <button disabled>Send reset link</button>
        </form>
        <form id="complete-reset" method="post" hidden>
            <p><label for="new-password">New password (8–128 characters)</label></p>
            <input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
            <p><label for="confirm-password">Confirm new password</label></p>
            <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
            <p><button disabled>Reset password</button></p>
        </form>
        <p id="recovery-status" role="status" aria-live="polite"></p>
        <a href="/index.html">Return to RevMetrix</a>
    </main>
    <script type="module" src="/js/password_reset.js"></script>
    <script type="module" src="/js/language.js"></script>
</body>
</html>
