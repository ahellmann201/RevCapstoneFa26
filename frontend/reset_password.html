<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>RevMetrix | Change Password</title>
    <link rel="icon" type="image/svg+xml" href="/icons/revmetrix_logo.png">
    <link rel="stylesheet" href="/css/password_reset.css">
    <script type="module" src="/js/theme.js"></script>
</head>
<body>
    <navbar></navbar>
    <main class="password-page">
        <section class="password-card" aria-labelledby="password-title">
            <h1 id="password-title" data-i18n="Change Password">Change Password</h1>
            <p class="password-description">Enter your current password, then choose and confirm a new one.</p>
            <form id="change-password-form" class="password-form">
                <div class="password-field">
                    <label for="current-password" data-i18n="Current Password">Current password</label>
                    <div class="password-input-wrap">
                        <input id="current-password" name="current_password" type="password" autocomplete="current-password" maxlength="128" required>
                        <button class="password_visibility" type="button" aria-controls="current-password" aria-label="Show password" aria-pressed="false"></button>
                    </div>
                </div>
                <div class="password-field">
                    <label for="new-password" data-i18n="New Password">New password</label>
                    <div class="password-input-wrap">
                        <input id="new-password" name="new_password" type="password" autocomplete="new-password" minlength="8" maxlength="128" aria-describedby="password-requirement" required>
                        <button class="password_visibility" type="button" aria-controls="new-password" aria-label="Show password" aria-pressed="false"></button>
                    </div>
                    <span id="password-requirement" class="password-requirement">Use 8 to 128 characters.</span>
                </div>
                <div class="password-field">
                    <label for="confirm-password" data-i18n="Confirm New Password">Confirm new password</label>
                    <div class="password-input-wrap">
                        <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
                        <button class="password_visibility" type="button" aria-controls="confirm-password" aria-label="Show password" aria-pressed="false"></button>
                    </div>
                </div>
                <p id="password-status" class="password-status" role="status" aria-live="polite"></p>
                <div class="password-actions">
                    <button id="cancel-password-change" class="password-cancel" type="button" data-i18n="Cancel">Cancel</button>
                    <button id="submit-password-change" class="password-submit" type="submit" data-i18n="Submit">Submit</button>
                </div>
            </form>
        </section>
    </main>
    <script type="module" src="/js/password_reset.js"></script>
</body>
</html>
